<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styles/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="item header-logo">
        <div class="header-logo-wrapper">
          <img src="assets/settings.png" class="icon" alt="" />
          <h1 class="h1-logo">Messenger</h1>
        </div>
      </div>

      <div class="item header-actions">
        <div class="user-info">
          <div class="user-avatar"></div>
          <h1 class="h1-user">User</h1>
        </div>
        <div class="header-icons">
          <img src="assets/phone.png" class="icon" alt="" />
          <img src="assets/videocall.png" class="icon" alt="" />
          <img src="assets/othersett.png" class="icon" alt="" />
        </div>
      </div>

      <div class="item chat-list-1">
        <div class="chat-card">
          <div class="user-avatar-chat-list"></div>
          <div class="chat-list-text">
            <h1 class="chat-list-user">User 1</h1>
            <p class="last-message">last message</p>
          </div>
        </div>

        <div class="chat-card">
          <div class="user-avatar-chat-list"></div>
          <div class="chat-list-text">
            <h1 class="chat-list-user">User 1</h1>
            <p class="last-message">last message</p>
          </div>
        </div>

        <div class="chat-card">
          <div class="user-avatar-chat-list"></div>
          <div class="chat-list-text">
            <h1 class="chat-list-user">User 1</h1>
            <p class="last-message">last message</p>
          </div>
        </div>

        <div class="chat-card">
          <div class="user-avatar-chat-list"></div>
          <div class="chat-list-text">
            <h1 class="chat-list-user">User 1</h1>
            <p class="last-message">last message</p>
          </div>
        </div>
      </div>

      <div class="item chat-window">
        <div class="chat-window-messages">
          <div class="my-mess">
            <div class="my-short-mess"></div>
            <div class="my-long-mess"></div>
          </div>

          <div class="user-mess">
            <div class="user-short-mess"></div>
            <div class="user-long-mess"></div>
          </div>
        </div>

        <div class="message-div">
          <div class="type-message">
            <div class="mess-div-start-typing">
              <img src="assets/smile.png" alt="">
              <p>Start typing</p>
            </div>
            <div class="mess-div-photo"><img src="assets/photo.png" alt=""></div>
            
          </div>
          <div class="send-message">
            <img src="/assets/send.png" alt="">
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
